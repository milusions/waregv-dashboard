<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ware GV Login</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="page-shell">
      <section class="brand-panel" aria-label="Branding panel">
        <div class="brand-mark" aria-hidden="true">
          <img src="logo.svg" alt="WareGV Logo" width="32" height="auto">

        </div>
        <h1>Milusions <span>Ware GV</span></h1>
        <p>Autonomous equipment control for precision field operations, fleet readiness, and live rover oversight.</p>

        <div class="rover-visual" aria-label="Ware GV rover preview">
          <img src="rover-hero.png" alt="Ware GV rover thumbnail" />
        </div>
      </section>

      <section class="form-panel" aria-label="Login form area">
        <div class="login-card">
          <div class="company-tag"><span class="tiny-dot"></span> Milusions</div>
          <h2>Welcome back</h2>
          <p class="subtitle">Sign in to continue to your Ware GV dashboard.</p>

          <form id="login-form" novalidate>
            <div class="form-field">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" value="waregv" readonly autocomplete="username" />
            </div>

            <div class="form-field">
              <label for="password">Password (Rover IP)</label>
              <input id="password" name="password" type="text" placeholder="192.168.1.25" autocomplete="off" />
            </div>

            <div class="form-row">
              <label class="checkbox-wrap"><input type="checkbox" name="remember" /> Remember this IP</label>
              <button type="button" class="link-btn">Need help?</button>
            </div>

            <button id="login-submit" type="submit" class="primary-btn">Sign in</button>
            <div id="login-error" class="error-box" aria-live="polite"></div>
          </form>
        </div>
      </section>
    </div>

    <script src="login.js"></script>
  </body>
</html>
