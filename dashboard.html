<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WareGV Rover Dashboard</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c232c;
    --border: #2a323d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --good: #2ecc71;
    --warn: #f1c40f;
    --bad: #e74c3c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  header .conn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #555;
    display: inline-block;
  }

  main {
    padding: 16px 20px 40px;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
    max-width: 1600px;
    margin: 0 auto;
  }

  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }

  .panel h2 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
  }

  /* Stats bar */
  #sys-stats {
    display: flex;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
  }

  #sys-stats .stat { white-space: nowrap; }
  #sys-stats b { font-weight: 600; }
  #sys-stats .stat-detail { opacity: 0.65; font-size: 12px; }

  /* Video grids */
  .video-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 700px) {
    .video-grid { grid-template-columns: 1fr; }
  }

  .video-wrap {
    position: relative;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    aspect-ratio: 16/9;
  }

  .video-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .video-wrap .label {
    position: absolute;
    top: 8px;
    left: 10px;
    padding: 3px 8px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #ddd;
  }

  .video-wrap .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* Forms */
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0 4px;
  }

  input, select, button, textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    width: 100%;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    cursor: pointer;
    background: var(--accent);
    border-color: var(--accent);
    color: #0b0f14;
    font-weight: 600;
    transition: opacity .15s;
  }

  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  button.secondary {
    background: var(--panel-2);
    border-color: var(--border);
    color: var(--text);
    font-weight: 500;
  }

  button.danger {
    background: var(--bad);
    border-color: var(--bad);
    color: #fff;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }

  /* Pose readout */
  #pose-readout {
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    white-space: pre;
    overflow-x: auto;
  }

  #pose-readout .k { color: var(--muted); }

  /* Waypoints */
  #wp-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 180px;
    overflow-y: auto;
    margin-top: 6px;
  }

  .wp-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    font: 12px/1.4 ui-monospace, monospace;
  }

  .wp-item button {
    width: auto;
    padding: 2px 8px;
    font-size: 11px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    max-width: 360px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 100;
  }

  #toast.show { opacity: 1; }
  #toast.ok { border-color: var(--good); }
  #toast.err { border-color: var(--bad); }
</style>
</head>
<body>

<header>
  <h1>WareGV Rover Dashboard</h1>
  <div class="conn">
    <span id="api-dot" class="dot"></span>
    <span id="api-label">backend: –</span>
    <span style="opacity:.5">|</span>
    <span id="cam-dot" class="dot"></span>
    <span id="cam-label">camera: –</span>
  </div>
</header>

<main>

  <!-- ============ LEFT COLUMN ============ -->
  <section>

    <!-- System stats bar -->
    <div id="sys-stats">
      <span class="stat">CPU <b id="stat-cpu">–</b>%</span>
      <span class="stat">RAM <b id="stat-ram">–</b>%</span>
      <span class="stat stat-detail" id="stat-ram-detail"></span>
      <span class="stat">Load <b id="stat-load">–</b></span>
      <span class="stat">Temp <b id="stat-temp">–</b>°C</span>
      <span class="stat">Up <b id="stat-uptime">–</b></span>
      <span class="stat" id="stat-source" style="opacity:.5;font-size:12px"></span>
    </div>

    <!-- Camera feeds -->
    <div class="panel">
      <h2>Camera</h2>
      <div class="video-grid">
        <div class="video-wrap">
          <span class="label">Color</span>
          <img id="feed-color" alt="color stream"
               src="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
          <div class="placeholder" id="ph-color">waiting for color stream…</div>
        </div>
        <div class="video-wrap">
          <span class="label">Depth</span>
          <img id="feed-depth" alt="depth stream"
               src="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
          <div class="placeholder" id="ph-depth">waiting for depth stream…</div>
        </div>
      </div>
    </div>

    <!-- Pose readout -->
    <div class="panel" style="margin-top:16px">
      <h2>Robot pose (TF map → base_link)</h2>
      <div id="pose-readout">
<span class="k">x:</span>     – 
<span class="k">y:</span>     – 
<span class="k">yaw:</span>   – 
<span class="k">stamp:</span> –
      </div>
    </div>

    <!-- Waypoints -->
    <div class="panel" style="margin-top:16px">
      <h2>Waypoints queue</h2>
      <div class="row-3">
        <input id="wp-x"   type="number" step="0.01" placeholder="x" />
        <input id="wp-y"   type="number" step="0.01" placeholder="y" />
        <input id="wp-yaw" type="number" step="0.1"  placeholder="yaw°" />
      </div>
      <div class="actions" style="grid-template-columns:1fr 1fr">
        <button class="secondary" id="wp-add">+ Add</button>
        <button class="secondary" id="wp-clear">Clear</button>
      </div>
      <div id="wp-list"></div>
      <div class="actions">
        <button id="wp-send" disabled>Send waypoints</button>
        <button class="danger" id="abort">Abort</button>
      </div>
    </div>

  </section>

  <!-- ============ RIGHT COLUMN ============ -->
  <aside>

    <div class="panel">
      <h2>System mode</h2>
      <label for="mode-select">Mode</label>
      <select id="mode-select">
        <option value="auto_nav">auto_nav</option>
        <option value="manual">manual</option>
        <option value="mapping">mapping</option>
        <option value="fixed_map">fixed_map</option>
        <option value="update_map">update_map</option>
      </select>

      <label for="map-select">Map</label>
      <select id="map-select">
        <option value="">— none —</option>
      </select>

      <div class="actions">
        <button id="mode-apply">Apply</button>
        <button class="secondary" id="maps-refresh">Refresh maps</button>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>Initial pose</h2>
      <div class="row-3">
        <input id="ip-x"   type="number" step="0.01" placeholder="x" value="0" />
        <input id="ip-y"   type="number" step="0.01" placeholder="y" value="0" />
        <input id="ip-yaw" type="number" step="0.1"  placeholder="yaw°" value="0" />
      </div>
      <div class="actions" style="grid-template-columns:1fr 1fr">
        <button id="ip-set">Set pose</button>
        <button class="secondary" id="ip-use-current">Use current</button>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>Navigate to pose</h2>
      <div class="row-3">
        <input id="nav-x"   type="number" step="0.01" placeholder="x" />
        <input id="nav-y"   type="number" step="0.01" placeholder="y" />
        <input id="nav-yaw" type="number" step="0.1"  placeholder="yaw°" value="0" />
      </div>
      <div class="actions" style="grid-template-columns:1fr">
        <button id="nav-send">Send goal</button>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>SLAM</h2>
      <button class="danger" id="slam-reset">Reset SLAM</button>
    </div>

  </aside>
</main>

<div id="toast"></div>

<script>
/* =====================================================================
 * Configuration — change these to match your Pi's IPs.
 * ===================================================================== */
const API_BASE  = window.WAREGV_API_BASE  || "http://192.168.1.42:8000";
const CAM_BASE  = window.WAREGV_CAM_BASE  || "http://192.168.1.42:5000";

const STATS_POLL_MS = 2000;
const POSE_POLL_MS  = 1000;

/* =====================================================================
 * Helpers
 * ===================================================================== */
const $ = (id) => document.getElementById(id);

function toast(msg, kind = "ok") {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show " + (kind === "err" ? "err" : "ok");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = ""; }, 3500);
}

async function api(path, opts = {}) {
  const url = API_BASE + path;
  const res = await fetch(url, {
    cache: "no-store",
    ...opts,
    headers: {
      "Content-Type": "application/json",
      ...(opts.headers || {}),
    },
  });
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
  if (!res.ok) {
    const detail = data.detail || data.raw || `HTTP ${res.status}`;
    throw new Error(detail);
  }
  return data;
}

function setDot(el, ok) {
  el.style.background = ok ? "var(--good)" : "var(--bad)";
}

function fmtUptime(sec) {
  if (sec == null) return "–";
  sec = Math.floor(sec);
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m}m`;
}

/* =====================================================================
 * Camera streams — attach after DOMContentLoaded so onerror fires clean
 * ===================================================================== */
function startCameras() {
  const colorImg = $("feed-color");
  const depthImg = $("feed-depth");

  colorImg.onload = () => {
    $("ph-color").style.display = "none";
    colorImg.style.display = "block";
    setDot($("cam-dot"), true);
    $("cam-label").textContent = "camera: live";
  };
  colorImg.onerror = () => {
    colorImg.style.display = "none";
    $("ph-color").style.display = "flex";
    setDot($("cam-dot"), false);
    $("cam-label").textContent = "camera: offline";
    // retry every 5s
    setTimeout(() => {
      colorImg.src = `${CAM_BASE}/video_feed?t=${Date.now()}`;
    }, 5000);
  };

  depthImg.onload = () => {
    $("ph-depth").style.display = "none";
    depthImg.style.display = "block";
  };
  depthImg.onerror = () => {
    depthImg.style.display = "none";
    $("ph-depth").style.display = "flex";
    setTimeout(() => {
      depthImg.src = `${CAM_BASE}/depth_feed?t=${Date.now()}`;
    }, 5000);
  };

  colorImg.src = `${CAM_BASE}/video_feed?t=${Date.now()}`;
  depthImg.src = `${CAM_BASE}/depth_feed?t=${Date.now()}`;
}

/* =====================================================================
 * Stats polling
 * ===================================================================== */
async function pollStats() {
  try {
    const s = await api("/system/stats");

    const cpu = s.cpu_percent ?? 0;
    const ram = s.ram_percent ?? 0;
    const temp = s.temperature_c;

    $("stat-cpu").textContent = cpu.toFixed(1);
    $("stat-ram").textContent = ram.toFixed(1);
    $("stat-ram-detail").textContent =
      `${s.ram_used_mb ?? 0} / ${s.ram_total_mb ?? 0} MB`;

    const la = s.load_avg ?? [0, 0, 0];
    $("stat-load").textContent = la.map(v => v.toFixed(2)).join(" / ");

    $("stat-temp").textContent = temp != null ? temp.toFixed(1) : "n/a";
    $("stat-uptime").textContent = fmtUptime(s.uptime_s);
    $("stat-source").textContent = s.source ? `(${s.source})` : "";

    // Colour code
    $("stat-cpu").style.color = cpu > 85 ? "var(--bad)"
                              : cpu > 60 ? "var(--warn)" : "var(--good)";
    $("stat-ram").style.color = ram > 90 ? "var(--bad)"
                              : ram > 75 ? "var(--warn)" : "var(--good)";
    $("stat-temp").style.color = temp == null ? "inherit"
                              : temp > 75 ? "var(--bad)"
                              : temp > 60 ? "var(--warn)" : "var(--good)";

    setDot($("api-dot"), true);
    $("api-label").textContent = "backend: live";
  } catch (e) {
    setDot($("api-dot"), false);
    $("api-label").textContent = "backend: offline";
  }
}

/* =====================================================================
 * Pose polling
 * ===================================================================== */
async function pollPose() {
  try {
    const p = await api("/robot_pose");
    const pos = p.pose?.position;
    const yaw = p.pose?.yaw_deg;
    if (!pos) throw new Error("no pose");
    $("pose-readout").innerHTML =
      `<span class="k">x:</span>     ${pos.x.toFixed(2)}\n` +
      `<span class="k">y:</span>     ${pos.y.toFixed(2)}\n` +
      `<span class="k">yaw:</span>   ${yaw.toFixed(2)}°\n` +
      `<span class="k">stamp:</span> ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    $("pose-readout").innerHTML =
      `<span class="k">pose unavailable:</span> ${e.message}`;
  }
}

/* =====================================================================
 * Maps
 * ===================================================================== */
async function refreshMaps() {
  try {
    const data = await api("/maps");
    const sel = $("map-select");
    const current = sel.value;
    sel.innerHTML = '<option value="">— none —</option>';
    for (const m of (data.maps || [])) {
      const opt = document.createElement("option");
      opt.value = m.name;
      opt.textContent = m.name;
      sel.appendChild(opt);
    }
    if (current) sel.value = current;
  } catch (e) {
    toast("Could not list maps: " + e.message, "err");
  }
}

/* =====================================================================
 * Mode
 * ===================================================================== */
async function applyMode() {
  const mode = $("mode-select").value;
  const map_name = $("map-select").value;
  try {
    const r = await api("/system/mode", {
      method: "POST",
      body: JSON.stringify({ mode, map_name }),
    });
    toast(`Mode set: ${r.mode} · map: ${r.map_name || "—"}`);
  } catch (e) {
    toast("Mode change failed: " + e.message, "err");
  }
}

/* =====================================================================
 * Initial pose
 * ===================================================================== */
async function setInitialPose() {
  const x = parseFloat($("ip-x").value) || 0;
  const y = parseFloat($("ip-y").value) || 0;
  const yaw_deg = parseFloat($("ip-yaw").value) || 0;
  try {
    await api("/set_initial_pose", {
      method: "POST",
      body: JSON.stringify({ x, y, yaw_deg }),
    });
    toast(`Initial pose set: (${x}, ${y}, ${yaw_deg}°)`);
  } catch (e) {
    toast("Initial pose failed: " + e.message, "err");
  }
}

async function useCurrentPose() {
  try {
    const p = await api("/robot_pose");
    $("ip-x").value   = p.pose.position.x;
    $("ip-y").value   = p.pose.position.y;
    $("ip-yaw").value = p.pose.yaw_deg;
    toast("Filled with current pose");
  } catch (e) {
    toast("Could not read pose: " + e.message, "err");
  }
}

/* =====================================================================
 * Navigate to pose
 * ===================================================================== */
async function sendNavGoal() {
  const x = parseFloat($("nav-x").value);
  const y = parseFloat($("nav-y").value);
  const yaw_deg = parseFloat($("nav-yaw").value) || 0;
  if (isNaN(x) || isNaN(y)) { toast("Enter x and y", "err"); return; }
  try {
    await api("/navigate_to_pose", {
      method: "POST",
      body: JSON.stringify({ x, y, yaw_deg }),
    });
    toast(`Goal dispatched: (${x}, ${y}, ${yaw_deg}°)`);
  } catch (e) {
    toast("Nav goal failed: " + e.message, "err");
  }
}

/* =====================================================================
 * Waypoints
 * ===================================================================== */
const waypoints = [];

function renderWaypoints() {
  const list = $("wp-list");
  list.innerHTML = "";
  waypoints.forEach((w, i) => {
    const div = document.createElement("div");
    div.className = "wp-item";
    div.innerHTML = `
      <span>#${i + 1} · x=${w.x.toFixed(2)} y=${w.y.toFixed(2)} yaw=${w.yaw_deg.toFixed(1)}°</span>
      <button data-i="${i}">×</button>`;
    div.querySelector("button").onclick = () => {
      waypoints.splice(i, 1);
      renderWaypoints();
    };
    list.appendChild(div);
  });
  $("wp-send").disabled = waypoints.length === 0;
}

function addWaypoint() {
  const x = parseFloat($("wp-x").value);
  const y = parseFloat($("wp-y").value);
  const yaw_deg = parseFloat($("wp-yaw").value) || 0;
  if (isNaN(x) || isNaN(y)) { toast("Enter x and y", "err"); return; }
  waypoints.push({ x, y, yaw_deg });
  $("wp-x").value = $("wp-y").value = $("wp-yaw").value = "";
  renderWaypoints();
}

async function sendWaypoints() {
  if (!waypoints.length) return;
  try {
    const r = await api("/follow_waypoints", {
      method: "POST",
      body: JSON.stringify({ waypoints }),
    });
    toast(`Sent ${r.count} waypoints`);
  } catch (e) {
    toast("Waypoints failed: " + e.message, "err");
  }
}

/* =====================================================================
 * Abort / SLAM reset
 * ===================================================================== */
async function abortMission() {
  try {
    const r = await api("/abort", { method: "POST" });
    toast(`Aborted. Cancelled: ${(r.cancelled || []).join(", ") || "none"}`);
  } catch (e) {
    toast("Abort failed: " + e.message, "err");
  }
}

async function resetSlam() {
  if (!confirm("Reset SLAM and re-anchor map origin?")) return;
  try {
    const r = await api("/slam/reset", { method: "POST" });
    toast(r.reset_called ? "SLAM reset called" : "SLAM service unavailable (map re-anchored)");
  } catch (e) {
    toast("SLAM reset failed: " + e.message, "err");
  }
}

/* =====================================================================
 * Wire up
 * ===================================================================== */
document.addEventListener("DOMContentLoaded", () => {
  startCameras();

  $("mode-apply").onclick    = applyMode;
  $("maps-refresh").onclick  = refreshMaps;
  $("ip-set").onclick        = setInitialPose;
  $("ip-use-current").onclick= useCurrentPose;
  $("nav-send").onclick      = sendNavGoal;
  $("wp-add").onclick        = addWaypoint;
  $("wp-clear").onclick      = () => { waypoints.length = 0; renderWaypoints(); };
  $("wp-send").onclick       = sendWaypoints;
  $("abort").onclick         = abortMission;
  $("slam-reset").onclick    = resetSlam;

  refreshMaps();
  renderWaypoints();

  pollStats();  setInterval(pollStats, STATS_POLL_MS);
  pollPose();   setInterval(pollPose,  POSE_POLL_MS);
});
</script>

</body>
</html>
