<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WareGV | 3AM Robotics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="brand">
  <h1><span class="company">3AM Robotics</span> <span class="product">WareGV</span></h1>
  <button id="btn-app-full" class="fs" title="Full screen (whole site)" aria-label="Full screen (whole site)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</header>

<div id="main">
  <div id="left">
  <div id="map-wrap">
    <div id="stage">
      <canvas id="map" width="1280" height="720"></canvas>

      <!-- legend: top-left -->
      <details id="legend" class="overlay" open>
        <summary>Legend</summary>
        <label><input type="checkbox" data-layer="slam" checked><span class="sw" data-color="slam"></span>SLAM map</label>
        <label><input type="checkbox" data-layer="global" checked><span class="sw" data-color="global"></span>Global costmap</label>
        <label><input type="checkbox" data-layer="local" checked><span class="sw" data-color="local"></span>Local costmap</label>
        <label><input type="checkbox" data-layer="scan" checked><span class="sw" data-color="scan"></span>Lidar</label>
        <label><input type="checkbox" data-layer="path" checked><span class="sw" data-color="path"></span>Nav2 path</label>
      </details>

      <!-- warn-light toolbox: top-center, wider than tall, 6 icon buttons -->
      <div id="headlight-bar" class="overlay" role="toolbar" aria-label="Warn light mode">
        <span class="hl-title">Warn</span>
        <button class="hl-btn" data-mode="OFF"       data-tip="Off"        aria-label="Warn light off">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M4 4l16 16"/></svg>
        </button>
        <button class="hl-btn" data-mode="ON"        data-tip="Steady on"  aria-label="Warn light steady on">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        </button>
        <button class="hl-btn" data-mode="BLINK_2HZ" data-tip="Blink 2 Hz" aria-label="Warn light blink 2 hertz">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M6 9l-3-3M18 15l3 3"/></svg>
        </button>
        <button class="hl-btn" data-mode="BLINK_5HZ" data-tip="Blink 5 Hz" aria-label="Warn light blink 5 hertz">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M4 8l-2-4M20 16l2 4M4 16l-2 4M20 8l2-4"/></svg>
        </button>
        <button class="hl-btn" data-mode="PULSE_3"   data-tip="Pulse x3"   aria-label="Warn light pulse three times">
          <svg viewBox="0 0 24 24"><path d="M3 14l3-3 3 3 4-5 4 5 4-5"/><circle cx="12" cy="12" r="9" opacity="0.35"/></svg>
        </button>
        <button class="hl-btn" data-mode="PULSE_5"   data-tip="Pulse x5"   aria-label="Warn light pulse five times">
          <svg viewBox="0 0 24 24"><path d="M2 14l2.5-3 2.5 3 2.5-4 2.5 4 2.5-4 2.5 4 2.5-3 2.5 3"/><circle cx="12" cy="12" r="9" opacity="0.35"/></svg>
        </button>
        <span id="hl-state" class="hl-state">OFF</span>
      </div>

      <!-- toolbar with tooltips: top-right -->
      <div id="toolbar" class="overlay">
        <button id="btn-full" class="tool" data-tip="Full screen" aria-label="Full screen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button id="btn-goal" class="tool" data-tip="Set goal (click, drag to aim)" aria-label="Set goal">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>
        </button>
        <button id="btn-home" class="tool" data-tip="Return to home (0, 0, 0&deg;)" aria-label="Return to home">
          <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-6h4v6"/></svg>
        </button>
        <button id="btn-save" class="tool" data-tip="Save map" aria-label="Save map">
          <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg>
        </button>
        <button id="btn-cancel" class="tool" data-tip="Cancel navigation" aria-label="Cancel navigation">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
        </button>
        <button id="btn-clear" class="tool" data-tip="Clear costmaps" aria-label="Clear costmaps">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        </button>
        <button id="btn-fit" class="tool" data-tip="Reset view" aria-label="Reset view">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>
        </button>
      </div>

      <span id="nav-state" class="overlay">Nav: --</span>
    </div>
  </div>

  <div id="cams">
    <section class="panel">
      <div class="panel-head">
        <h2>Color camera</h2>
        <button class="fs" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="cam-box"><img id="cam-color" alt="Color camera"><span class="cam-msg" hidden>Camera not connected</span></div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <h2>Depth camera</h2>
        <button class="fs" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="cam-box"><img id="cam-depth" alt="Depth camera"><span class="cam-msg" hidden>Camera not connected</span></div>
    </section>
  </div>
  </div>

  <aside id="side">
    <section class="panel">
      <div class="panel-head">
        <h2>Joystick</h2>
        <button class="fs" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div id="joy" class="joy-box" role="application" aria-label="Drive joystick">
        <div class="joy-cross"></div>
        <div class="joy-knob"></div>
      </div>
      <div id="joy-settings">
        <label>Max linear <small>m/s</small><input id="set-lin" type="number" value="0.1" min="0.01" step="0.01"></label>
        <label>Max angular <small>rad/s</small><input id="set-ang" type="number" value="0.21" min="0.01" step="0.01"></label>
        <label>Linear accel <small>m/s&sup2;</small><input id="set-acc" type="number" value="0.25" min="0.01" step="0.1"></label>
        <label>Angular accel <small>rad/s&sup2;</small><input id="set-angacc" type="number" value="0.5" min="0.01" step="0.1"></label>
      </div>
    </section>

    <!-- ============ ARM / DISARM PANEL ============ -->
    <section class="panel" id="panel-arm">
      <div class="panel-head">
        <h2>Motor arm</h2>
        <button class="fs" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div id="arm-wrap">
        <button id="btn-arm" class="arm-btn" aria-pressed="false" aria-label="Arm motors">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v9"/>
            <path d="M7.5 6.3a7 7 0 1 0 9 0"/>
          </svg>
        </button>
        <div id="arm-state">Disarmed</div>
      </div>
    </section>
    <!-- ============ /ARM ============ -->

    <!-- ============ WARN-LIGHT PANEL ============ -->
    <section class="panel" id="panel-headlight">
      <div class="panel-head">
        <h2>Warn light</h2>
        <button class="fs" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div id="hl-panel-row" role="toolbar" aria-label="Warn light mode">
        <button class="hl-btn" data-mode="OFF"       data-tip="Off"        aria-label="Warn light off">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M4 4l16 16"/></svg>
        </button>
        <button class="hl-btn" data-mode="ON"        data-tip="Steady on"  aria-label="Warn light steady on">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        </button>
        <button class="hl-btn" data-mode="BLINK_2HZ" data-tip="Blink 2 Hz" aria-label="Warn light blink 2 hertz">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M6 9l-3-3M18 15l3 3"/></svg>
        </button>
        <button class="hl-btn" data-mode="BLINK_5HZ" data-tip="Blink 5 Hz" aria-label="Warn light blink 5 hertz">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M4 8l-2-4M20 16l2 4M4 16l-2 4M20 8l2-4"/></svg>
        </button>
        <button class="hl-btn" data-mode="PULSE_3"   data-tip="Pulse x3"   aria-label="Warn light pulse three times">
          <svg viewBox="0 0 24 24"><path d="M3 14l3-3 3 3 4-5 4 5 4-5"/><circle cx="12" cy="12" r="9" opacity="0.35"/></svg>
        </button>
        <button class="hl-btn" data-mode="PULSE_5"   data-tip="Pulse x5"   aria-label="Warn light pulse five times">
          <svg viewBox="0 0 24 24"><path d="M2 14l2.5-3 2.5 3 2.5-4 2.5 4 2.5-4 2.5 4 2.5-3 2.5 3"/><circle cx="12" cy="12" r="9" opacity="0.35"/></svg>
        </button>
      </div>
      <div id="hl-panel-state">Current: <b>OFF</b></div>
    </section>
    <!-- ============ /WARN-LIGHT ============ -->

    <section class="panel">
      <div class="panel-head">
        <h2>Odometry</h2>
        <button class="fs" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div id="odom-readout">
        <div class="odom-row"><span class="odom-label">X</span><span id="odom-x" class="odom-val">--</span></div>
        <div class="odom-row"><span class="odom-label">Y</span><span id="odom-y" class="odom-val">--</span></div>
        <div class="odom-row"><span class="odom-label">Heading</span><span id="odom-h" class="odom-val">--</span></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Ask Helio</h2>
        <button class="fs" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div id="helio-row">
        <input id="helio-q" type="text" placeholder="Ask Helio&hellip;" autocomplete="off">
        <button id="helio-ask">Ask</button>
      </div>
      <div id="helio-reply"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Navigation &amp; mapping log</h2>
        <button class="fs" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div id="log"></div>
    </section>
  </aside>
</div>

<script src="roslib_min.js"></script>
<script src="app.js"></script>
</body>
</html>
